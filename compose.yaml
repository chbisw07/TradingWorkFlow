services:
  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
    environment:
      TWF_ENVIRONMENT: development
      TWF_DATABASE_URL: ${TWF_DATABASE_URL:-sqlite+pysqlite:////app/twf.db}
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 3
  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    environment:
      TWF_API_ORIGIN: http://api:8000
    ports:
      - "127.0.0.1:3000:3000"
